<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light only"><style>body{margin:0}img{max-width:100%}</style></head><body>

<style id="app-style">
/* Layout: one phone-width column of game cards, a sticky "내 근무" finder on top */
:root{
  color-scheme:light;
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#0E1A2B; --muted:#526074; --line:#D6DCE5;
  --ref:#C2410C; --ref-soft:#FFE6D5; --staff:#8A6100; --staff-soft:#FFF1C2;
  --accent:#FF7A1A; --hi:#0E1A2B; --hi-ink:#FFD43B; --clash:#C2255C; --clash-soft:#FFE3EC;

}
:root[data-theme="dark"]{

  --ref:#FFB27A; --ref-soft:#4A2814; --staff:#FFD43B; --staff-soft:#3F3410;
  --accent:#FF8A33; --hi:#FFD43B; --hi-ink:#0E1A2B; --clash:#FF8FB1; --clash-soft:#4A1A2B; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.banner{background:var(--staff-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;margin:0}
.finder{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(14,26,43,.08)}
.finder label{font-weight:900;font-size:15px}
.finder select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.mine-list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.mine-list li{background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.mine-list li.clash{background:var(--clash);color:#FFFFFF}
.empty{color:var(--muted);font-size:14px;margin:0}
.round-h{font-family:var(--display);font-weight:400;font-size:22px;margin:8px 0 0;display:flex;align-items:baseline;gap:8px}
.round-h small{font-family:var(--body);font-size:13px;color:var(--muted)}
.game{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.game.mine{border:2px solid var(--hi)}
.when{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;padding:8px 4px}
.when .d{font-family:var(--display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.when .w{font-size:13px;font-weight:700;color:var(--muted)}
.gbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.no{font-weight:900}
.won{font-size:12px;font-weight:700;background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:2px 8px}
.match{margin:0;color:var(--muted);font-size:14px}
.match b{color:var(--ink)}
.duty{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lab{font-size:12px;font-weight:900;width:34px;flex:none}
.lab.refs{color:var(--ref)} .lab.staff{color:var(--staff)}
.chip{display:inline-flex;align-items:baseline;gap:4px;border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}
.chip small{font-size:11px;font-weight:500;opacity:.8}
.chip.refs{background:var(--ref-soft)} .chip.staff{background:var(--staff-soft)}
.chip.me{background:var(--hi);color:var(--hi-ink)}
.chip.clash{outline:2px solid var(--clash);outline-offset:-2px}
.chip em{font-style:normal;font-size:11px;color:var(--clash);font-weight:900}
.chip.me em{color:var(--hi-ink)}
.chip.open{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.wait{font-size:13px;color:var(--muted)}
.foot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.foot b{color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#14121C}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.6;cursor:default}
.draw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.draw h2{font-size:16px;margin:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slots label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
select.sm{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.edit-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700}
.savebar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.msg{font-size:13px;color:var(--muted);margin:0}
.sg-sec{display:flex;flex-direction:column;gap:10px}
.sg-h{font-family:var(--display);font-weight:400;font-size:22px;margin:8px 0 0}
.sg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sg svg{width:100%;max-width:150px;height:auto;align-self:center;display:block}
.sg h3{margin:0;font-size:16px;font-weight:900}
.sg.wide{grid-column:span 2}
.sg-ph{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:#fff}
.sg:not(.wide) .sg-ph{max-width:170px;align-self:center}
.sg .fno{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.sg p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.sg-body{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.sg-head{fill:var(--card);stroke:var(--ink);stroke-width:4}
.sg-arm{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.sg-fist{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.sg-palm{fill:var(--card);stroke:var(--accent);stroke-width:3}
.sg-fing{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.sg-move{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 4}
.sg-head2{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sg-bar{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.sg-num{fill:var(--accent)}
.sg-numt{fill:#14121C;font-family:var(--body);font-weight:900;font-size:13px}
.sg-hit{fill:none;stroke:var(--clash);stroke-width:2.5;stroke-linecap:round}
.sg-steps{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px;list-style:none}
.sg-steps li{display:flex;gap:8px;align-items:baseline}
.sg-steps b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--hi);color:var(--hi-ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs a{display:block;text-align:center;padding:9px 0;white-space:nowrap;font-size:15px;border-radius:10px;font-weight:900;color:var(--muted);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--hi);color:var(--hi-ink)}
.bk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bk-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bk-scroll svg{display:block;width:100%;min-width:680px;height:auto}
.bk-line{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:square}
.bk-adv{stroke:var(--accent);stroke-width:7}
.bk-box{fill:var(--card);stroke:var(--ink);stroke-width:2.5}
.bk-box.win{fill:var(--hi)}
.bk-box.champ{fill:var(--staff-soft)}
.bk-box.dash{stroke-dasharray:5 4}
.bk-t{fill:var(--ink);font-family:var(--body);font-weight:900;font-size:17px}
.bk-t.win{fill:var(--hi-ink)}
.bk-t.dim{fill:var(--muted);font-weight:700;font-size:14px}
.bk-lab{fill:var(--ink);font-family:var(--body);font-weight:700;font-size:15px}
.bk-won{fill:var(--accent);font-family:var(--body);font-weight:900;font-size:15px}
.bk-cap{font-family:var(--display);font-size:20px;fill:var(--ink)}
.bk-note{margin:0;font-size:13px;color:var(--muted)}
.bk-note b{color:var(--accent)}
.op-intro{background:var(--staff-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin:0}
.op-intro b{font-weight:900}
.op-phase{display:flex;flex-direction:column;gap:0}
.op-ph{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:400;font-size:22px;margin:8px 0 10px}
.op-ph small{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--staff)}
.op-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.op-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:12px}
.op-step:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.op-n{width:34px;height:34px;border-radius:50%;background:var(--hi);color:var(--hi-ink);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;position:relative}
.op-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.op-card h3{margin:0;font-size:16px;font-weight:900}
.op-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.op-card p b{color:var(--ink)}
.op-tag{align-self:flex-start;font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;background:var(--ref-soft);color:var(--ref)}
.op-alert{background:var(--card);border:2px solid var(--clash);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.op-alert h3{margin:0;font-size:16px;font-weight:900;color:var(--clash)}
.op-alert ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.qr-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:900;color:var(--ink)}
.qr-btn svg{width:60px;height:60px;display:block}
.qr-modal{position:fixed;inset:0;z-index:20;background:rgba(14,26,43,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.qr-box{background:var(--card);border-radius:20px;padding:20px;width:min(100%,360px);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qr-box h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.qr-box svg{width:100%;max-width:280px;height:auto;display:block}
.qr-box p{margin:0;font-size:13px;color:var(--muted);word-break:break-all}
.qr-box button{width:100%}

    if (t.hasAttribute('data-slot')) { S.slots[+t.getAttribute('data-slot')] = t.value; var filledSlots = S.slots.filter(function(s){ return s; }); msg = uniq(filledSlots).length < filledSlots.length ? '같은 반이 두 칸에 들어갔어요. 확인해 주세요.' : ''; render(); return; }
    if (t.hasAttribute('data-win')) { S.games[+t.getAttribute('data-win')].win = t.value; render(); return; }
    var gi = t.getAttribute('data-g'); if (gi == null) return;
    S.games[+gi][t.getAttribute('data-k')][+t.getAttribute('data-i')] = t.value;
  });
  var original = null;
  app.addEventListener('click', function(e){
    if (e.target.id === 'qr-bg') { qrOpen = false; render(); return; }
    var bt = e.target.closest ? e.target.closest('button') : e.target;
    var id = bt ? bt.id : '';
    if (id === 'qr') { qrOpen = true; render(); return; }
    if (id === 'qr-close') { qrOpen = false; render(); var qb = document.getElementById('qr'); if (qb) qb.focus(); return; }
    if (id === 'edit') { original = JSON.stringify(S); editing = true; msg = '추첨 결과와 경기 결과를 넣고 ‘남은 경기 자동 배정’을 누르면 원칙대로 채워져요. 직접 바꿔도 돼요.'; render(); }
    else if (id === 'cancel') { S = JSON.parse(original); editing = false; msg = ''; render(); }
    else if (id === 'save') save();
    else if (id === 'auto') { var k = firstUpcoming(); var r = autoAssign(k); msg = (k > 0 ? '지난 ' + k + '경기는 그대로 두고 ' : '') + '근무자 ' + r.filled + '자리를 채웠어요' + (r.removed ? ', 자기 반이 나올 수 있는 ' + r.removed + '자리는 비웠어요' : '') + '. 확인 후 저장하세요.'; render(); }
  });
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var HEAD = '<title>런치리그 근무표</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">\n';
  function buildDoc(){
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-script').textContent;
    var json = JSON.stringify(S).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' + HEAD +
      '<style id="app-style">' + css + '</style>\n<main id="app" class="wrap"><p class="eyebrow">GALMAE 3RD GRADE · LUNCH LEAGUE BASKETBALL</p><h1>심판·운영진 근무표</h1><p class="sub">근무표를 불러오는 중이에요.</p></main>\n' +
      '<script type="application/json" id="state">' + json + '<\/script>\n<script id="app-script">' + js + '<\/script>\n</body></html>';
  }
  async function save(){
    if (saving) return;
    saving = true; msg = ''; render();
    var d = new Date(); S.updated = (d.getMonth() + 1) + '/' + d.getDate();
    try {
      var ns = window.claude && window.claude.use ? await window.claude.use('artifact') : null;
      if (!ns) throw {code:'not_granted'};
      await ns.publish(buildDoc());
      msg = '저장했어요. 새 근무표로 다시 불러와요.';
    } catch (err) {
      var c = err && err.code;
      if (c === 'conflict') msg = '다른 곳에서 먼저 저장했어요. 최신 근무표로 다시 불러와요.';
      else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled') { msg = '이 화면에서는 근무표를 바꿀 수 없어요. 보기 전용이에요.'; canEdit = false; editing = false; }
      else if (c === 'rate_limited') msg = '저장이 너무 잦아요. 잠시 뒤 다시 눌러 주세요.';
      else msg = '저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.';
    }
    saving = false; render();
  }
  document.addEventListener('keydown', function(e){ if (qrOpen && e.key === 'Escape') { qrOpen = false; render(); } });
  window.addEventListener('hashchange', function(){ if (!editing) render(); });
  render();
  (async function(){
    try {
      if (!window.claude || !window.claude.use) return;
      var u = await window.claude.use('user');
      if (u && u.canEdit) { canEdit = !!(await u.canEdit()); if (canEdit) render(); }
    } catch (e) {}
  })();
})();
</script>
